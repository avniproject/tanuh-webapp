name: CI

on:
  push:
    branches: [main, '[0-9]+.[0-9]+']
  pull_request:
  # deploy.yml runs these checks before it deploys UAT.
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
